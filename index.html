<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="EcoCypher ESG: claims register with greenwashing checks, fingerprinted evidence library, Scope 1 and 2 emissions and BRSR reporting for ESG teams." />
    <meta name="theme-color" content="#FAF6EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EcoCypher" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <title>EcoCypher ESG</title>
  </head>
  <body>
    <!--splash:start-->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #FAF6EA; color: #24352D; transition: opacity .38s ease, transform .38s ease; }
      .sp-dark #splash { background: #0F1A15; color: #F1ECDD; }
      #splash.out { opacity: 0; transform: scale(1.015); pointer-events: none; }
      #splash .sp-inner { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      #splash .sp-logo { position: relative; width: 104px; height: 104px; animation: sp-in .7s cubic-bezier(.2,.8,.2,1) both; }
      #splash .sp-logo img { width: 100%; height: 100%; border-radius: 50%; display: block; box-shadow: 0 14px 40px rgba(20, 88, 63, .22); }
      #splash .sp-logo::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1.5px solid rgba(228, 179, 71, .55); animation: sp-ring 1.8s ease-out .5s infinite; }
      #splash .sp-name { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-weight: 600; font-size: 2rem; letter-spacing: -.01em; margin-top: 6px; animation: sp-up .7s .15s cubic-bezier(.2,.8,.2,1) both; }
      #splash .sp-tag { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: .95rem; color: #6E7C74; animation: sp-up .7s .28s cubic-bezier(.2,.8,.2,1) both; }
      .sp-dark #splash .sp-tag { color: #93A099; }
      #splash .sp-bar { position: absolute; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom)); width: 120px; height: 2px; margin-left: -60px; border-radius: 2px; background: rgba(36, 53, 45, .1); overflow: hidden; }
      .sp-dark #splash .sp-bar { background: rgba(250, 246, 234, .12); }
      #splash .sp-bar span { position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #E4B347; animation: sp-load 1.1s ease-in-out infinite; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.9); } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px); } }
      @keyframes sp-ring { 0% { opacity: .9; transform: scale(.94); } 100% { opacity: 0; transform: scale(1.25); } }
      @keyframes sp-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash * { animation: none !important; transition: none !important; } }
    </style>
    <div id="splash" role="status" aria-label="Opening EcoCypher">
      <div class="sp-inner">
        <div class="sp-logo"><img src="/logo.svg" alt="" width="104" height="104" /></div>
        <div class="sp-name">EcoCypher</div>
        <div class="sp-tag">Green claims, proven by evidence</div>
      </div>
      <div class="sp-bar" aria-hidden="true"><span></span></div>
    </div>
    <script>
      (function () {
        var t0 = Date.now(), seen = false;
        try { seen = sessionStorage.getItem('ec-splash') === '1'; sessionStorage.setItem('ec-splash', '1'); } catch (e) {}
        var min = seen ? 250 : 1400; // full splash once per visit, a quick fade after that
        try {
          var p = localStorage.getItem('ecocypher-theme-v2');
          if (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('sp-dark');
        } catch (e) {}
        window.__hideSplash = function () {
          var el = document.getElementById('splash');
          if (!el || el.getAttribute('data-out')) return;
          el.setAttribute('data-out', '1');
          setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 420); }, Math.max(0, min - (Date.now() - t0)));
        };
        setTimeout(function () { window.__hideSplash(); }, 10000); // never block the app
      })();
    </script>
    <!--splash:end-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
